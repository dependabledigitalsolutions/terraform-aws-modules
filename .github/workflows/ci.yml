name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"

      - run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Modules using configuration_aliases (e.g. aws.us_east_1) cannot
        # validate standalone — point at examples/minimal instead so the
        # consumer-side provider wiring is in scope.
        target:
          - modules/account-baseline/examples/minimal
          - modules/iam-identity-center
          - modules/static-website
          - modules/route53-registered-domain/examples/minimal
          - modules/vpc-ecs-cloudfront
          - modules/ops-alerting
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"

      - run: terraform -chdir=${{ matrix.target }} init -backend=false -input=false

      - run: terraform -chdir=${{ matrix.target }} validate

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # boto3 ships in the Lambda runtime; tests need it locally to import
      # output_utils. urllib3 too — already a transitive of botocore but pin
      # explicitly so the import succeeds regardless of what's pre-installed.
      - name: Install runtime dependencies
        run: pip install boto3 urllib3

      - name: ops-alerting handler tests
        working-directory: modules/ops-alerting/src/alerting
        run: python -m unittest discover -v
