name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"

      - run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Modules using configuration_aliases (e.g. aws.us_east_1) cannot
        # validate standalone — point at examples/minimal instead so the
        # consumer-side provider wiring is in scope.
        target:
          - modules/account-baseline/examples/minimal
          - modules/iam-identity-center
          - modules/static-website
          - modules/route53-registered-domain/examples/minimal
          - modules/vpc-ecs-cloudfront
          - modules/ops-alerting
          - modules/media-moderation-pipeline
          - modules/media-moderation-pipeline/examples/basic
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"

      - run: terraform -chdir=${{ matrix.target }} init -backend=false -input=false

      - run: terraform -chdir=${{ matrix.target }} validate

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ops-alerting dev deps
        working-directory: modules/ops-alerting/src/alerting
        run: pip install -r requirements-dev.txt

      - name: ops-alerting handler tests
        working-directory: modules/ops-alerting/src/alerting
        run: python -m unittest discover -v

  media-moderation-pipeline-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/media-moderation-pipeline/src
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: modules/media-moderation-pipeline/src/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
