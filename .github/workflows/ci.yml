name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: validate every module
        run: |
          set -e
          for dir in modules/*/; do
            # Modules using configuration_aliases (e.g. aws.us_east_1) cannot
            # validate standalone — terraform requires the consumer to wire the
            # aliased provider. For those, validate the examples/minimal/ instead.
            if [ -d "$dir/examples/minimal" ]; then
              target="$dir/examples/minimal"
            else
              target="$dir"
            fi
            echo "==> validating $target"
            (cd "$target" && terraform init -backend=false -input=false && terraform validate)
          done
